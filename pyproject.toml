[project]
name = "payment_agent"
version = "0.1.0"
description = "Conversational payment-collection agent (Anthropic Agent Engineer take-home)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # 0.50+ for the top-level `thinking` parameter on messages.create
    # (extended thinking; required for the determinism contract per DECISIONS #20).
    "anthropic>=0.50.0",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/payment_agent"]
omit = [
    # cli.py is a thin REPL wrapper exercised by manual smoke, not pytest.
    # extract.py is intentionally NOT omitted — its interface code (schema build,
    # response parsing, slot conversions, fail-soft regex) is unit-testable and
    # counts toward coverage. Prompt content + extraction quality are eval-driven
    # (eval/extractor_eval.py) per DECISIONS #14 and PLAN §4, not coverage-gated.
    "src/payment_agent/cli.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
